<!DOCTYPE html>
<html>
<head>
  <title>Risk Register - Compact Mobile-First</title>
  <style>
:root {
  /* Brand and action */
  --colour-blue: #005eb8;
  --colour-blue-dark: #003d78;
  --colour-green: #00703c;
  --colour-green-dark: #00401e;
  --colour-purple: #4c1d95;

  /* Status */
  --colour-focus: #ffdd00;
  --colour-error: #d4351c;
  --colour-warning: #f47738;
  --colour-success: #00703c;

  /* Text and surfaces */
  --colour-ink: #212b32;
  --colour-secondary-text: #4c6272;
  --colour-border: #b1b4b6;
  --colour-page: #f3f2f1;
  --colour-panel: #ffffff;
  --colour-panel-soft: #fafafa;
  --colour-grey: #e8edee;
  --colour-blue-wash: #e9f2f8;
  --colour-green-wash: #e9f5ee;
  --colour-yellow-wash: #fff7bf;

  /* Layout */
  --content-max: 1520px;
  --form-column: 520px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* Shape and depth */
  --border-width: 2px;
  --radius-small: 4px;
  --radius-dialog: 18px;
  --shadow-panel: 0 2px 8px rgb(0 0 0 / 7%);
  --shadow-dialog: 0 24px 70px rgb(0 27 68 / 67%);
}

body {
  margin: 0;
  color: var(--colour-ink);
  background: var(--colour-page);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
h1 { margin: 0 0 8px; color: var(--colour-blue-dark); font-size: 34px; line-height: 1.12; }
h2 { margin: 0; color: var(--colour-blue-dark); font-size: 26px; line-height: 1.2; }
h3 { margin: 0 0 14px; font-size: 19px; line-height: 1.3; }
p  { max-width: 70ch; }

/* Mobile-first layout */
.service-header {
  color: #fff;
  background: var(--colour-blue);
  border-bottom: 6px solid var(--colour-blue-dark);
  padding: 12px 16px;
  font-size: 20px;
  font-weight: 700;
}
.service-header__inner {
  max-width: var(--content-max);
  margin: auto;
  padding: 0;
}
.panel {
  min-width: 0;
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  box-shadow: var(--shadow-panel);
  margin: 12px 0;
  padding: 16px;
}
.form-panel {
  padding: 16px;
}
.result-panel {
  padding: 16px;
}
  
    /* --- Component CSS restored from STYLE_GUIDE.md sections 5-11 --- */
    .panel__heading { padding: 22px; border-bottom: 1px solid var(--colour-border); }
    .form-body { padding: 22px; }
    .form-group {
      margin: 0 0 22px;
      padding: 18px;
      background: var(--colour-panel-soft);
      border: 1px solid var(--colour-border);
      border-left: 6px solid var(--colour-blue);
    }
    .form-group > legend {
      padding: 0 8px;
      color: var(--colour-blue-dark);
      font-size: 19px;
      font-weight: 700;
    }
    label, .field-label { display: block; margin: 0 0 5px; font-weight: 700; }
    .hint { display: block; margin: -2px 0 7px; color: var(--colour-secondary-text); font-size: 14px; }
    input, textarea, select {
      width: 100%;
      margin: 0 0 16px;
      padding: 10px;
      color: var(--colour-ink);
      background: #fff;
      border: 2px solid var(--colour-secondary-text);
      border-radius: 0;
      font: inherit;
    }
    textarea { min-height: 76px; resize: vertical; }
    button:focus-visible,
    input:focus,
    textarea:focus,
    select:focus,
    summary:focus-visible {
      outline: 3px solid var(--colour-focus);
      outline-offset: 0;
      box-shadow: inset 0 0 0 2px #0b0c0c;
    }
    .date-input { margin: 0 0 24px; padding: 0; border: 0; }
    .date-input__items { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .date-input__item { width: 72px; }
    .date-input__item--year { width: 104px; }
    .date-input__item label { font-size: 16px; font-weight: 400; }
    .date-input__item input {
      min-height: 48px;
      margin-bottom: 0;
      padding: 8px;
      font-size: 19px;
      text-align: left;
    }
    .choice-group { margin: 0 0 24px; padding: 0; border: 0; }
    .large-radio {
      position: relative;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      max-width: 42rem;
      min-height: 52px;
      margin: 0 0 10px;
      padding: 10px 12px;
      background: #fff;
      border: 2px solid var(--colour-border);
      cursor: pointer;
    }
    .large-radio:hover { background: var(--colour-blue-wash); }
    .large-radio input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .large-radio__control {
      display: block;
      width: 32px;
      height: 32px;
      background: #fff;
      border: 3px solid var(--colour-ink);
      border-radius: 50%;
    }
    .large-radio input:checked + .large-radio__control {
      box-shadow: inset 0 0 0 7px #fff;
      background: var(--colour-ink);
    }
    .large-radio:has(input:checked) {
      border-color: var(--colour-blue);
      background: var(--colour-blue-wash);
    }
    .large-radio:has(input:focus-visible) {
      outline: 3px solid var(--colour-focus);
      outline-offset: 0;
      box-shadow: inset 0 0 0 2px #0b0c0c;
    }
    .large-radio strong, .large-radio small { display: block; }
    .large-radio small { margin-top: 2px; color: var(--colour-secondary-text); font-size: 14px; }
    .notice { padding: 13px; border-left: 5px solid var(--colour-focus); background: var(--colour-yellow-wash); }
    .notice--success { border-color: var(--colour-success); background: var(--colour-green-wash); }
    .error-message { margin: 0 0 12px; color: var(--colour-error); font-weight: 700; }
    .field--error { padding-left: 14px; border-left: 5px solid var(--colour-error); }
    .field--error input { border-color: var(--colour-error); }
    .status-line { min-height: 24px; font-weight: 700; }
    .statement-preview {
      margin: 0 0 22px;
      padding: 18px;
      background: var(--colour-green-wash);
      border-left: 8px solid var(--colour-green);
    }
    .rating-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rating-card { padding: 10px; background: var(--colour-grey); border-top: 5px solid var(--colour-blue); }
    .rating-card span { display: block; font-size: 12px; }
    .rating-card strong { display: block; font-size: 20px; }
    @media (max-width: 560px) { .rating-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="service-header">
    <div class="service-header__inner">
      Risk Register
    </div>
  </header>
  
  <div class="form-panel">
    <h2>Risk Form</h2>
    
    <div id="form-status" class="status-line" role="status" aria-live="polite"></div>
    
    <fieldset class="form-group">
      <legend class="field-label">1. Risk statement</legend>
      <p class="hint">Describe the risk using the format: If [cause/driver] happens, then [risk event] may occur, resulting in [business impact].</p>
      <textarea name="risk_statement" rows="4" cols="50" required></textarea>
    </fieldset>
    
    <fieldset class="form-group">
      <legend class="field-label">2. Assessment</legend>
      
      <fieldset class="date-input" aria-describedby="review-date-hint">
        <legend class="field-label">Review date</legend>
        <div id="review-date-hint" class="hint">For example, 31 8 2026</div>
        <div class="date-input__items">
          <div class="date-input__item">
            <label for="review-day">Day</label>
            <input id="review-day" name="review_day" inputmode="numeric"
                   autocomplete="off" maxlength="2" pattern="[0-9]*" size="2">
          </div>
          <div class="date-input__item">
            <label for="review-month">Month</label>
            <input id="review-month" name="review_month" inputmode="numeric"
                   autocomplete="off" maxlength="2" pattern="[0-9]*" size="2">
          </div>
          <div class="date-input__item date-input__item--year">
            <label for="review-year">Year</label>
            <input id="review-year" name="review_year" inputmode="numeric"
                   autocomplete="off" maxlength="4" pattern="[0-9]*" size="4">
          </div>
        </div>
      </fieldset>
      
      <fieldset class="choice-group" aria-describedby="appetite-hint">
        <legend class="field-label">Risk appetite</legend>
        <div id="appetite-hint" class="hint">Select one option.</div>
        <label class="large-radio">
          <input type="radio" name="appetite" value="Low" required>
          <span class="large-radio__control" aria-hidden="true"></span>
          <span><strong>Low</strong><small>Only limited exposure is acceptable.</small></span>
        </label>
        <label class="large-radio">
          <input type="radio" name="appetite" value="Moderate">
          <span class="large-radio__control" aria-hidden="true"></span>
          <span><strong>Moderate</strong><small>Managed exposure may be accepted.</small></span>
        </label>
        <label class="large-radio">
          <input type="radio" name="appetite" value="High">
          <span class="large-radio__control" aria-hidden="true"></span>
          <span><strong>High</strong><small>Significant exposure may be accepted.</small></span>
        </label>
        <label class="large-radio">
          <input type="radio" name="appetite" value="Very high">
          <span class="large-radio__control" aria-hidden="true"></span>
          <span><strong>Very high</strong><small>High exposure is acceptable.</small></span>
        </label>
      </fieldset>
    </fieldset>
    
    <button class="button" type="submit">Raise risk</button>
    <button class="button button--secondary" type="button">Save as draft</button>
  </div>
  
  <div class="result-panel">
    <h2>Risk Result</h2>
    <p>Result content would go here</p>
  </div>
  
  <script>
function validateAndFormatDate(dayInput, monthInput, yearInput, errorElement) {
  const day = Number(dayInput.value);
  const month = Number(monthInput.value);
  const year = Number(yearInput.value);
  
  if (isNaN(day) || isNaN(month) || isNaN(year)) {
    return null;
  }
  
  const candidate = new Date(Date.UTC(year, month - 1, day));
  const valid = candidate.getUTCFullYear() === year &&
    candidate.getUTCMonth() === month - 1 && candidate.getUTCDate() === day;
    
  if (!valid) {
    return null;
  }
  
  return `${year.toString().padStart(4, "0")}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

function getRating(score) {
  if (score >= 1 && score <= 4) return 'Low';
  if (score >= 5 && score <= 9) return 'Moderate';
  if (score >= 10 && score <= 16) return 'High';
  if (score >= 17 && score <= 25) return 'Critical';
  return 'Unknown';
}

function updateResultPanel() {
  const statement = document.querySelector('textarea[name="risk_statement"]').value;
  const checkedRadio = document.querySelector('input[name="appetite"]:checked');
  const dayInput = document.getElementById('review-day');
  const monthInput = document.getElementById('review-month');
  const yearInput = document.getElementById('review-year');
  
  if (!statement || !checkedRadio) return;
  
  const reviewDate = validateAndFormatDate(dayInput, monthInput, yearInput);
  if (!reviewDate) return;
  
  const appetite = checkedRadio.value;
  const impact = appetite === 'Low' ? 1 : 
                appetite === 'Moderate' ? 2 : 
                appetite === 'High' ? 3 : 4;
  const likelihood = 3;
  const score = likelihood * impact;
  const rating = getRating(score);
  
  const statementPreview = `<div class="statement-preview">
    <p><strong>Risk statement:</strong> ${statement}</p>
    <p><strong>Review date:</strong> ${reviewDate}</p>
  </div>`;
  
  const ratingGrid = `<div class="rating-grid">
    <div class="rating-card">
      <span>Score</span>
      <strong>${score}</strong>
    </div>
    <div class="rating-card">
      <span>Likelihood</span>
      <strong>${likelihood}</strong>
    </div>
    <div class="rating-card">
      <span>Impact</span>
      <strong>${impact}</strong>
    </div>
    <div class="rating-card">
      <span>Rating</span>
      <strong>${rating}</strong>
    </div>
  </div>`;
  
  document.querySelector('.result-panel').innerHTML = `
    <h2>Risk Result</h2>
    ${statementPreview}
    ${ratingGrid}
  `;
}
  </script>
  
  <script>
document.addEventListener('DOMContentLoaded', function() {
  // Attach input event listeners to all form fields
  const textarea = document.querySelector('textarea[name="risk_statement"]');
  const appetiteRadios = document.querySelectorAll('input[name="appetite"]');
  const dayInput = document.getElementById('review-day');
  const monthInput = document.getElementById('review-month');
  const yearInput = document.getElementById('review-year');
  
  // Function to attach event listeners
  function attachListener(element, callback) {
    if (element) {
      element.addEventListener('input', callback);
    }
  }
  
  // Attach listeners to all form fields
  attachListener(textarea, updateResultPanel);
  appetiteRadios.forEach(radio => attachListener(radio, updateResultPanel));
  attachListener(dayInput, updateResultPanel);
  attachListener(monthInput, updateResultPanel);
  attachListener(yearInput, updateResultPanel);
  
  // Call updateResultPanel once immediately to show initial state
  updateResultPanel();
});
  </script>
</body>
</html>
