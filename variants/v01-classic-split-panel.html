<!DOCTYPE html>
<html>
<head>
  <title>Risk Register</title>
  <style>
:root {
  /* Brand and action */
  --colour-blue: #005eb8;
  --colour-blue-dark: #003d78;
  --colour-green: #00703c;
  --colour-green-dark: #00401e;
  --colour-purple: #4c1d95;

  /* Status */
  --colour-focus: #ffdd00;
  --colour-error: #d4351c;
  --colour-warning: #f47738;
  --colour-success: #00703c;

  /* Text and surfaces */
  --colour-ink: #212b32;
  --colour-secondary-text: #4c6272;
  --colour-border: #b1b4b6;
  --colour-page: #f3f2f1;
  --colour-panel: #ffffff;
  --colour-panel-soft: #fafafa;
  --colour-grey: #e8edee;
  --colour-blue-wash: #e9f2f8;
  --colour-green-wash: #e9f5ee;
  --colour-yellow-wash: #fff7bf;

  /* Layout */
  --content-max: 1520px;
  --form-column: 520px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* Shape and depth */
  --border-width: 2px;
  --radius-small: 4px;
  --radius-dialog: 18px;
  --shadow-panel: 0 2px 8px rgb(0 0 0 / 7%);
  --shadow-dialog: 0 24px 70px rgb(0 27 68 / 67%);
}

* { box-sizing: border-box; }
.service-header {
  color: #fff;
  background: var(--colour-blue);
  border-bottom: 6px solid var(--colour-blue-dark);
}
.service-header__inner {
  max-width: var(--content-max);
  margin: auto;
  padding: 20px 24px;
  font-size: 23px;
  font-weight: 700;
}
.page-grid {
  display: grid;
  grid-template-columns: minmax(360px, var(--form-column)) minmax(0, 1fr);
  gap: 22px;
  max-width: var(--content-max);
  margin: auto;
  padding: 24px;
}
.panel {
  min-width: 0;
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  box-shadow: var(--shadow-panel);
}
@media (max-width: 950px) {
  .page-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .page-grid { padding: 10px; }
}
  </style>
</head>
<body>
  <header class="service-header">
    <div class="service-header__inner">Risk Register</div>
  </header>
  <div class="page-grid">
    <div class="panel form-panel"></div>
    <div class="panel result-panel"></div>
  </div>
</body>
</html>
