<!DOCTYPE html>
<html>
<head>
  <title>Risk Register</title>
  <style>
:root {
  /* Brand and action */
  --colour-blue: #005eb8;
  --colour-blue-dark: #003d78;
  --colour-green: #00703c;
  --colour-green-dark: #00401e;
  --colour-purple: #4c1d95;

  /* Status */
  --colour-focus: #ffdd00;
  --colour-error: #d4351c;
  --colour-warning: #f47738;
  --colour-success: #00703c;

  /* Text and surfaces */
  --colour-ink: #212b32;
  --colour-secondary-text: #4c6272;
  --colour-border: #b1b4b6;
  --colour-page: #f3f2f1;
  --colour-panel: #ffffff;
  --colour-panel-soft: #fafafa;
  --colour-grey: #e8edee;
  --colour-blue-wash: #e9f2f8;
  --colour-green-wash: #e9f5ee;
  --colour-yellow-wash: #fff7bf;

  /* Layout */
  --content-max: 1520px;
  --form-column: 520px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* Shape and depth */
  --border-width: 2px;
  --radius-small: 4px;
  --radius-dialog: 18px;
  --shadow-panel: 0 2px 8px rgb(0 0 0 / 7%);
  --shadow-dialog: 0 24px 70px rgb(0 27 68 / 67%);
}
  </style>
</head>
<body>
</body>
</html>
