<!DOCTYPE html>
<html>
<head>
  <title>Risk Register - Guided Wizard</title>
  <style>
    :root {
      /* Brand and action */
      --colour-blue: #005eb8;
      --colour-blue-dark: #003d78;
      --colour-green: #00703c;
      --colour-green-dark: #00401e;
      --colour-purple: #4c1d95;

      /* Status */
      --colour-focus: #ffdd00;
      --colour-error: #d4351c;
      --colour-warning: #f47738;
      --colour-success: #00703c;

      /* Text and surfaces */
      --colour-ink: #212b32;
      --colour-secondary-text: #4c6272;
      --colour-border: #b1b4b6;
      --colour-page: #f3f2f1;
      --colour-panel: #ffffff;
      --colour-panel-soft: #fafafa;
      --colour-grey: #e8edee;
      --colour-blue-wash: #e9f2f8;
      --colour-green-wash: #e9f5ee;
      --colour-yellow-wash: #fff7bf;

      /* Layout */
      --content-max: 1520px;
      --form-column: 520px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;

      /* Shape and depth */
      --border-width: 2px;
      --radius-small: 4px;
      --radius-dialog: 18px;
      --shadow-panel: 0 2px 8px rgb(0 0 0 / 7%);
      --shadow-dialog: 0 24px 70px rgb(0 27 68 / 67%);
    }
    
    body {
      margin: 0;
      color: var(--colour-ink);
      background: var(--colour-page);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    h1 { margin: 0 0 8px; color: var(--colour-blue-dark); font-size: 34px; line-height: 1.12; }
    h2 { margin: 0; color: var(--colour-blue-dark); font-size: 26px; line-height: 1.2; }
    h3 { margin: 0 0 14px; font-size: 19px; line-height: 1.3; }
    p  { max-width: 70ch; }
    
    .service-header {
      color: #fff;
      background: var(--colour-blue);
      border-bottom: 6px solid var(--colour-blue-dark);
    }
    .service-header__inner {
      max-width: var(--content-max);
      margin: auto;
      padding: 20px 24px;
      font-size: 23px;
      font-weight: 700;
    }
    
    .wizard-progress {
      display: flex;
      justify-content: space-between;
      max-width: var(--content-max);
      margin: 20px auto;
      padding: 0 24px;
    }
    
    .wizard-step {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-bottom: 3px solid var(--colour-border);
    }
    
    .wizard-step.active {
      border-bottom: 3px solid var(--colour-blue);
      font-weight: 700;
    }
    
    .wizard-step.completed {
      border-bottom: 3px solid var(--colour-green);
      color: var(--colour-green);
    }
    
    .wizard-step-number {
      display: inline-block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      border-radius: 50%;
      background: var(--colour-border);
      color: var(--colour-ink);
      margin-right: 8px;
    }
    
    .wizard-step.active .wizard-step-number {
      background: var(--colour-blue);
      color: white;
    }
    
    .wizard-step.completed .wizard-step-number {
      background: var(--colour-green);
      color: white;
    }
    
    .panel {
      min-width: 0;
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      box-shadow: var(--shadow-panel);
      margin: 0 auto 20px;
      max-width: var(--content-max);
      padding: 22px;
    }
    
    .form-panel {
      display: block;
    }
    
    .result-panel {
      display: none;
    }
    
    .button {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      color: #fff;
      background: var(--colour-green);
      border: 0;
      border-bottom: 4px solid var(--colour-green-dark);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      margin: 10px 5px;
    }
    
    .button:hover {
      filter: brightness(.88);
    }
    
    .button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
    
    .button--secondary {
      color: var(--colour-blue);
      background: #fff;
      border: 2px solid var(--colour-blue);
      border-bottom-width: 3px;
    }
    
    .button--secondary:hover {
      color: #fff;
      background: var(--colour-blue);
    }
    
    .wizard-controls {
      display: flex;
      justify-content: space-between;
      padding: 20px 24px;
      max-width: var(--content-max);
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header class="service-header">
    <div class="service-header__inner">
      Risk Register
    </div>
  </header>
  
  <div class="wizard-progress">
    <div class="wizard-step active">
      <span class="wizard-step-number">1</span> Risk statement
    </div>
    <div class="wizard-step">
      <span class="wizard-step-number">2</span> Assessment and ownership
    </div>
    <div class="wizard-step">
      <span class="wizard-step-number">3</span> Review
    </div>
  </div>
  
  <div class="panel form-panel">
    <h2>Risk Statement</h2>
    <p>Enter the risk statement and supporting details.</p>
    <!-- Form content would go here -->
  </div>
  
  <div class="panel result-panel">
    <h2>Review</h2>
    <p>Review your risk entry before submitting.</p>
    <!-- Result content would go here -->
  </div>
  
  <div class="wizard-controls">
    <button class="button button--secondary" id="backButton">Back</button>
    <button class="button" id="nextButton">Next</button>
  </div>
</body>
</html>
